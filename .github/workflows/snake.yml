name: Generate contribution snake

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate SVG files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237C3DFF&color_dots=%23ebedf0,%23B8FFF9,%2300F5FF,%237C3DFF,%23FF2BD6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2300F5FF&color_dots=%23161b22,%230B3A42,%23006D77,%237C3DFF,%23FF2BD6

      - name: Publish SVG files to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

