<svg width="520" height="170" viewBox="0 0 520 170" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub profile status panel</title>
  <desc id="desc">Local neon GitHub status panel for NicolasSoft.</desc>
  <defs>
    <linearGradient id="g" x1="32" y1="24" x2="488" y2="146" gradientUnits="userSpaceOnUse"><stop stop-color="#00F5FF"/><stop offset=".52" stop-color="#7C3DFF"/><stop offset="1" stop-color="#FF2BD6"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="520" height="170" rx="16" fill="#050814"/>
  <rect x="8" y="8" width="504" height="154" rx="14" fill="#07101E" stroke="url(#g)" stroke-width="2"/>
  <text x="28" y="46" font-family="Consolas, Monaco, monospace" font-size="20" fill="#E8F7FF">github.status</text>
  <text x="28" y="76" font-family="Consolas, Monaco, monospace" font-size="15" fill="#7DF9FF">NicolasSoft / public signal</text>
  <g font-family="Consolas, Monaco, monospace" filter="url(#glow)">
    <text x="30" y="126" font-size="32" fill="#00F5FF">17+</text>
    <text x="132" y="126" font-size="32" fill="#FF2BD6">2026</text>
    <text x="284" y="126" font-size="32" fill="#7C3DFF">ONLINE</text>
  </g>
  <g font-family="Consolas, Monaco, monospace" font-size="12" fill="#8CA4C9">
    <text x="31" y="146">projects</text>
    <text x="133" y="146">portfolio year</text>
    <text x="285" y="146">build mode</text>
  </g>
</svg>
